<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="300" fill="#f8f9fa" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">De "nombre de carrera" a variables numéricas</text>

  <!-- Columna izquierda: antes -->
  <rect x="30" y="55" width="220" height="220" rx="10" fill="#fce4e4" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#501313">ANTES</text>
  <text x="140" y="100" text-anchor="middle" font-size="11" fill="#791F1F">Columna original</text>
  <rect x="50" y="115" width="180" height="36" rx="6" fill="#fff" stroke="#E24B4A" stroke-width="1"/>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#A32D2D">"Kona Ironman 2023"</text>
  <rect x="50" y="161" width="180" height="36" rx="6" fill="#fff" stroke="#E24B4A" stroke-width="1"/>
  <text x="140" y="184" text-anchor="middle" font-size="12" fill="#A32D2D">"Paris Triathlon 2022"</text>
  <rect x="50" y="207" width="180" height="36" rx="6" fill="#fff" stroke="#E24B4A" stroke-width="1"/>
  <text x="140" y="230" text-anchor="middle" font-size="12" fill="#A32D2D">"Zurich Tri 2023"</text>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#791F1F">← El modelo no entiende esto</text>

  <!-- Flecha central -->
  <line x1="258" y1="165" x2="310" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="284" y="156" text-anchor="middle" font-size="11" fill="#555">ETL</text>

  <!-- Columna derecha: después -->
  <rect x="315" y="55" width="455" height="220" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="542" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">DESPUÉS</text>
  <text x="542" y="100" text-anchor="middle" font-size="11" fill="#0F6E56">Variables numéricas que entiende el modelo</text>

  <!-- Headers -->
  <rect x="330" y="110" width="75" height="28" rx="4" fill="#085041"/>
  <text x="368" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Altitud (m)</text>
  <rect x="415" y="110" width="75" height="28" rx="4" fill="#085041"/>
  <text x="453" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Temp (°C)</text>
  <rect x="500" y="110" width="75" height="28" rx="4" fill="#085041"/>
  <text x="538" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Humedad %</text>
  <rect x="585" y="110" width="80" height="28" rx="4" fill="#085041"/>
  <text x="625" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Desnivel (m)</text>
  <rect x="675" y="110" width="80" height="28" rx="4" fill="#085041"/>
  <text x="715" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Tipo agua</text>

  <!-- Row 1 -->
  <rect x="330" y="146" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="368" y="165" text-anchor="middle" font-size="12" fill="#085041">6</text>
  <rect x="415" y="146" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="453" y="165" text-anchor="middle" font-size="12" fill="#085041">29</text>
  <rect x="500" y="146" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="538" y="165" text-anchor="middle" font-size="12" fill="#085041">78</text>
  <rect x="585" y="146" width="80" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="625" y="165" text-anchor="middle" font-size="12" fill="#085041">180</text>
  <rect x="675" y="146" width="80" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="715" y="165" text-anchor="middle" font-size="12" fill="#085041">Mar (3)</text>

  <!-- Row 2 -->
  <rect x="330" y="182" width="75" height="28" rx="4" fill="#f5fdf9" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="368" y="201" text-anchor="middle" font-size="12" fill="#085041">35</text>
  <rect x="415" y="182" width="75" height="28" rx="4" fill="#f5fdf9" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="453" y="201" text-anchor="middle" font-size="12" fill="#085041">21</text>
  <rect x="500" y="182" width="75" height="28" rx="4" fill="#f5fdf9" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="538" y="201" text-anchor="middle" font-size="12" fill="#085041">62</text>
  <rect x="585" y="182" width="80" height="28" rx="4" fill="#f5fdf9" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="625" y="201" text-anchor="middle" font-size="12" fill="#085041">95</text>
  <rect x="675" y="182" width="80" height="28" rx="4" fill="#f5fdf9" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="715" y="201" text-anchor="middle" font-size="12" fill="#085041">Lago (2)</text>

  <!-- Row 3 -->
  <rect x="330" y="218" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="368" y="237" text-anchor="middle" font-size="12" fill="#085041">408</text>
  <rect x="415" y="218" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="453" y="237" text-anchor="middle" font-size="12" fill="#085041">18</text>
  <rect x="500" y="218" width="75" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="538" y="237" text-anchor="middle" font-size="12" fill="#085041">55</text>
  <rect x="585" y="218" width="80" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="625" y="237" text-anchor="middle" font-size="12" fill="#085041">320</text>
  <rect x="675" y="218" width="80" height="28" rx="4" fill="#fff" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="715" y="237" text-anchor="middle" font-size="12" fill="#085041">Lago (2)</text>

  <text x="542" y="268" text-anchor="middle" font-size="11" fill="#0F6E56">✓ El modelo entiende estos números directamente</text>
</svg>
