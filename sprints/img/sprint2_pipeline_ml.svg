<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#f8f9fa" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Sprint 2 — Pipeline de Machine Learning</text>

  <!-- Features box -->
  <rect x="30" y="60" width="160" height="200" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#26215C">Features entrada</text>
  <text x="52" y="108" font-size="11" fill="#3C3489">· Media últimas 5 pruebas</text>
  <text x="52" y="126" font-size="11" fill="#3C3489">· Mejor marca personal</text>
  <text x="52" y="144" font-size="11" fill="#3C3489">· Nº pruebas temporada</text>
  <text x="52" y="162" font-size="11" fill="#3C3489">· Altitud prueba</text>
  <text x="52" y="180" font-size="11" fill="#3C3489">· Temperatura día</text>
  <text x="52" y="198" font-size="11" fill="#3C3489">· Humedad</text>
  <text x="52" y="216" font-size="11" fill="#3C3489">· Desnivel acumulado</text>
  <text x="52" y="234" font-size="11" fill="#3C3489">· Días desde última prueba</text>

  <line x1="190" y1="160" x2="225" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modelos candidatos -->
  <rect x="225" y="60" width="190" height="200" rx="10" fill="#fff" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Modelos candidatos</text>

  <rect x="240" y="98" width="160" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="320" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#042C53">Baseline</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#185FA5">Media histórica atleta</text>

  <rect x="240" y="150" width="160" height="42" rx="8" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1"/>
  <text x="320" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Random Forest</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#0F6E56">Robusto e interpretable</text>

  <rect x="240" y="202" width="160" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="320" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#26215C">XGBoost</text>
  <text x="320" y="236" text-anchor="middle" font-size="11" fill="#3C3489">Mayor precisión tabular</text>

  <!-- Flecha a validación -->
  <line x1="415" y1="160" x2="450" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Validación cruzada -->
  <rect x="450" y="80" width="150" height="160" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="525" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Validación</text>
  <text x="525" y="122" text-anchor="middle" font-size="11" fill="#854F0B">K-Fold (k=5)</text>
  <text x="525" y="140" text-anchor="middle" font-size="11" fill="#854F0B">Separación temporal</text>
  <line x1="470" y1="155" x2="580" y2="155" stroke="#BA7517" stroke-width="0.8"/>
  <text x="525" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Métricas</text>
  <text x="525" y="192" text-anchor="middle" font-size="11" fill="#854F0B">RMSE · MAE · R²</text>
  <text x="525" y="210" text-anchor="middle" font-size="11" fill="#854F0B">Objetivo: RMSE &lt;120s</text>
  <text x="525" y="228" text-anchor="middle" font-size="11" fill="#854F0B">(= &lt;2 minutos)</text>

  <line x1="600" y1="160" x2="635" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modelo final + SHAP -->
  <rect x="635" y="60" width="140" height="200" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="705" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Modelo final</text>
  <text x="705" y="104" text-anchor="middle" font-size="11" fill="#0F6E56">ML Model Registry</text>
  <line x1="650" y1="118" x2="770" y2="118" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="705" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">+ SHAP</text>
  <text x="705" y="160" text-anchor="middle" font-size="11" fill="#0F6E56">Por qué predice</text>
  <text x="705" y="178" text-anchor="middle" font-size="11" fill="#0F6E56">ese tiempo</text>
  <line x1="650" y1="195" x2="770" y2="195" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="705" y="214" text-anchor="middle" font-size="11" fill="#0F6E56">Top 3 factores</text>
  <text x="705" y="232" text-anchor="middle" font-size="11" fill="#0F6E56">más influyentes</text>

  <!-- Nota SHAP ejemplo -->
  <rect x="30" y="290" width="740" height="72" rx="10" fill="#fff8e1" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="50" y="314" font-size="12" font-weight="700" fill="#633806">Ejemplo de salida SHAP para el locutor:</text>
  <text x="50" y="334" font-size="11" fill="#854F0B">  "Se espera que Atleta X sea más lento de lo normal porque: (1) temperatura muy alta +45s · (2) altitud elevada +30s · (3) poco descanso +20s"</text>
  <text x="50" y="352" font-size="11" fill="#854F0B">  → El locutor puede contarlo en directo con contexto real, no solo el número.</text>
</svg>
