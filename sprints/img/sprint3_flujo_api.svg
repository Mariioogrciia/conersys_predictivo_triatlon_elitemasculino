<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#f8f9fa" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Sprint 3 — Flujo de la API y el Chatbot</text>

  <!-- Locutor -->
  <rect x="20" y="155" width="110" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="75" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">Locutor</text>
  <text x="75" y="199" text-anchor="middle" font-size="11" fill="#185FA5">Dashboard / Chat</text>

  <!-- Arrow locutor → API -->
  <line x1="130" y1="185" x2="178" y2="185" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="154" y="176" text-anchor="middle" font-size="10" fill="#185FA5">HTTPS</text>

  <!-- API FastAPI -->
  <rect x="178" y="120" width="150" height="130" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
  <text x="253" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">API FastAPI</text>
  <text x="253" y="166" text-anchor="middle" font-size="11" fill="#854F0B">Container Apps</text>
  <line x1="195" y1="178" x2="310" y2="178" stroke="#BA7517" stroke-width="0.8"/>
  <text x="253" y="198" text-anchor="middle" font-size="11" fill="#854F0B">/predict</text>
  <text x="253" y="216" text-anchor="middle" font-size="11" fill="#854F0B">/ranking</text>
  <text x="253" y="234" text-anchor="middle" font-size="11" fill="#854F0B">/alerta-anomalia</text>

  <!-- Arrow API → ML Endpoint -->
  <line x1="328" y1="155" x2="390" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ML Online Endpoint -->
  <rect x="390" y="60" width="155" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="468" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">ML Endpoint</text>
  <text x="468" y="104" text-anchor="middle" font-size="11" fill="#3C3489">Predicción de tiempo</text>
  <text x="468" y="120" text-anchor="middle" font-size="11" fill="#3C3489">+ SHAP features</text>

  <!-- Arrow API → SQL -->
  <line x1="328" y1="185" x2="390" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQL Database -->
  <rect x="390" y="160" width="155" height="60" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="468" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">SQL Database</text>
  <text x="468" y="204" text-anchor="middle" font-size="11" fill="#0F6E56">Histórico de atletas</text>

  <!-- Arrow API → Redis -->
  <line x1="328" y1="215" x2="390" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Redis -->
  <rect x="390" y="235" width="155" height="60" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="468" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Redis Cache</text>
  <text x="468" y="279" text-anchor="middle" font-size="11" fill="#0F6E56">Respuestas en caché</text>

  <!-- Arrow API → OpenAI -->
  <line x1="328" y1="235" x2="390" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Azure OpenAI -->
  <rect x="390" y="300" width="155" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="468" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Azure OpenAI</text>
  <text x="468" y="342" text-anchor="middle" font-size="11" fill="#854F0B">GPT-4o · Chatbot</text>
  <text x="468" y="358" text-anchor="middle" font-size="11" fill="#854F0B">Respuesta en &lt;2s</text>

  <!-- Key Vault -->
  <rect x="600" y="160" width="165" height="60" rx="10" fill="#fcebeb" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="683" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#501313">Key Vault</text>
  <text x="683" y="204" text-anchor="middle" font-size="11" fill="#A32D2D">Claves nunca en código</text>

  <!-- Arrow ML/OpenAI → Key Vault -->
  <line x1="548" y1="190" x2="596" y2="190" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Latencia badge -->
  <rect x="600" y="280" width="165" height="80" rx="10" fill="#fff8e1" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="683" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Objetivos latencia</text>
  <text x="683" y="326" text-anchor="middle" font-size="11" fill="#854F0B">Predicción: &lt;500ms</text>
  <text x="683" y="344" text-anchor="middle" font-size="11" fill="#854F0B">Chat: &lt;2 segundos</text>
  <text x="683" y="362" text-anchor="middle" font-size="11" fill="#854F0B">(streaming GPT)</text>
</svg>
