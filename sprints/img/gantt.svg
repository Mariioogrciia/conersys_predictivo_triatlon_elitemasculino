<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="300" fill="#f8f9fa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Planificación del proyecto — Gantt</text>

  <!-- Dates header -->
  <text x="190" y="56" text-anchor="middle" font-size="10" fill="#666">07 Abr</text>
  <text x="310" y="56" text-anchor="middle" font-size="10" fill="#666">04 May</text>
  <text x="415" y="56" text-anchor="middle" font-size="10" fill="#666">18 May</text>
  <text x="510" y="56" text-anchor="middle" font-size="10" fill="#666">01 Jun</text>
  <text x="585" y="56" text-anchor="middle" font-size="10" fill="#666">08 Jun</text>
  <text x="700" y="56" text-anchor="middle" font-size="10" fill="#666">22 Jun</text>

  <!-- Grid lines -->
  <line x1="190" y1="60" x2="190" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="310" y1="60" x2="310" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="415" y1="60" x2="415" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="60" x2="510" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="585" y1="60" x2="585" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="700" y1="60" x2="700" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Row labels -->
  <text x="10" y="96" font-size="11" font-weight="700" fill="#085041">Sprint 1</text>
  <text x="10" y="112" font-size="10" fill="#0F6E56">ETL y datos</text>

  <text x="10" y="156" font-size="11" font-weight="700" fill="#26215C">Sprint 2</text>
  <text x="10" y="172" font-size="10" fill="#3C3489">Modelo ML</text>

  <text x="10" y="216" font-size="11" font-weight="700" fill="#633806">Sprint 3</text>
  <text x="10" y="232" font-size="10" fill="#854F0B">API y Chatbot</text>

  <text x="10" y="266" font-size="11" font-weight="700" fill="#042C53">Sprint 4</text>
  <text x="10" y="282" font-size="10" fill="#185FA5">Dashboard</text>

  <!-- Sprint 1 bar: 07 Abr → 04 May  (x=190 → 310) -->
  <rect x="190" y="75" width="120" height="36" rx="8" fill="#1D9E75"/>
  <text x="250" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4 semanas</text>

  <!-- Sprint 2 bar: 04 May → 18 May (x=310 → 415) -->
  <rect x="310" y="135" width="105" height="36" rx="8" fill="#534AB7"/>
  <text x="363" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2 semanas</text>

  <!-- Sprint 3 bar: 18 May → 01 Jun (x=415 → 510) -->
  <rect x="415" y="195" width="95" height="36" rx="8" fill="#BA7517"/>
  <text x="463" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2 semanas</text>

  <!-- Sprint 4 bar: 01 Jun → 22 Jun (x=510 → 700) -->
  <rect x="510" y="250" width="190" height="36" rx="8" fill="#185FA5"/>
  <text x="605" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3 semanas</text>

  <!-- Hito entrega final -->
  <polygon points="700,248 708,260 692,260" fill="#E24B4A"/>
  <text x="703" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#E24B4A">ENTREGA</text>
</svg>
