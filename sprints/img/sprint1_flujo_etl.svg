<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#f8f9fa" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Sprint 1 — Flujo ETL completo</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="130" height="70" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="95" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">CSV cliente</text>
  <text x="95" y="119" text-anchor="middle" font-size="11" fill="#0F6E56">Datos brutos</text>

  <line x1="160" y1="105" x2="195" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="195" y="70" width="130" height="70" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="260" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Blob Storage</text>
  <text x="260" y="119" text-anchor="middle" font-size="11" fill="#0F6E56">Capa raw/</text>

  <line x1="325" y1="105" x2="360" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="360" y="70" width="130" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="425" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">ML Notebooks</text>
  <text x="425" y="112" text-anchor="middle" font-size="11" fill="#3C3489">EDA · limpieza</text>
  <text x="425" y="128" text-anchor="middle" font-size="11" fill="#3C3489">outliers · nulos</text>

  <line x1="490" y1="105" x2="525" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="525" y="70" width="130" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="590" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Enriquecimiento</text>
  <text x="590" y="112" text-anchor="middle" font-size="11" fill="#3C3489">Altitud · Temp</text>
  <text x="590" y="128" text-anchor="middle" font-size="11" fill="#3C3489">Desnivel · Agua</text>

  <line x1="655" y1="105" x2="690" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="690" y="70" width="80" height="70" rx="10" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="730" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">SQL DB</text>
  <text x="730" y="119" text-anchor="middle" font-size="11" fill="#0F6E56">processed/</text>

  <!-- Decisión nulos -->
  <rect x="195" y="195" width="370" height="110" rx="10" fill="#fff8e1" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="380" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Estrategia de nulos</text>
  <rect x="215" y="232" width="155" height="58" rx="8" fill="#fff" stroke="#EF9F27" stroke-width="1"/>
  <text x="293" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#854F0B">Sin tiempo final</text>
  <text x="293" y="272" text-anchor="middle" font-size="11" fill="#633806">→ No participó</text>
  <text x="293" y="287" text-anchor="middle" font-size="11" fill="#633806">No se imputa</text>

  <rect x="390" y="232" width="155" height="58" rx="8" fill="#fff" stroke="#EF9F27" stroke-width="1"/>
  <text x="468" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#854F0B">DSQ / DNF / DNS</text>
  <text x="468" y="272" text-anchor="middle" font-size="11" fill="#633806">→ Flag separada</text>
  <text x="468" y="287" text-anchor="middle" font-size="11" fill="#633806">Subset para Sprint 2</text>

  <!-- Arrow from notebook to decision -->
  <line x1="425" y1="140" x2="425" y2="192" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
